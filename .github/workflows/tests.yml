name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 檢索與評估（示範模式，不呼叫 API）
        run: python rag.py eval --mock eval/mock_responses.json --out output/eval.json
      - name: 檢查評估結果
        run: |
          python - <<'PY'
          import json
          s = json.load(open("output/eval.json", encoding="utf-8"))["summary"]
          print(s)
          assert s["檢索命中率（正確段落在前 4 名）"] == "14/14"
          assert s["應答題答對"] == "14/14"
          assert s["拒答題正確拒答"] == "3/3"
          assert s["重試後仍有驗證問題"] == "0 題"
          PY
      - name: HTTP API 測試（示範模式）
        run: python test_api.py
      - name: 知識庫管線測試
        run: python test_pipeline.py

  kb-pipeline:
    # 知識庫更新檢查：資料檢查 → 和上一版比較 → 評估閘門；報告顯示在這次執行的摘要頁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取出上一版，用來比較變更
        run: |
          mkdir -p ../baseline
          if git rev-parse -q --verify HEAD^ > /dev/null; then git archive HEAD^ | tar -x -C ../baseline; fi
      - name: 資料檢查與評估閘門
        env:
          PRICE_CONFIRMED: ${{ contains(github.event.head_commit.message, '確認價格') }}
        run: |
          args="--baseline ../baseline"
          if [ "$PRICE_CONFIRMED" = "true" ]; then args="$args --price-confirmed"; fi
          python pipeline.py check $args

  docker:
    # 建置容器映像檔，實際啟動容器並送出 HTTP 請求，確認可以部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 建置映像檔
        run: docker build -t course-qa-rag .
      - name: 啟動容器（沒有金鑰 → 示範模式；每日上限 2 題）
        run: |
          docker run -d --name qa -p 8080:8080 -e ASK_DAILY_LIMIT=2 course-qa-rag
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
      - name: 呼叫容器內的 API
        run: |
          set -e
          curl -sf localhost:8080/health | tee /dev/stderr | grep -q '"mode": "mock"'
          curl -sf localhost:8080/ | grep -q '課程問答'
          curl -sf -X POST localhost:8080/ask -H 'Content-Type: application/json' \
            -d '{"question": "多益衝刺班一期多少錢？"}' | tee /dev/stderr | grep -q '18,000'
          curl -sf -X POST localhost:8080/ask -H 'Content-Type: application/json' -d '{"question": "有沒有日文課？"}' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/ask \
            -H 'Content-Type: application/json' -d '{"question": "多益衝刺班一期多少錢？"}')
          echo "第 3 題回應碼：$code"; test "$code" = 429
          curl -sf 'localhost:8080/search?q=%E9%80%80%E8%B2%BB' > /dev/null
          echo "容器測試通過"
      - name: 容器紀錄
        if: always()
        run: docker logs qa

  deploy:
    # 上面三項都通過、而且是推送到 main，才自動部署到 Cloud Run。
    # 用 Workload Identity Federation 登入 Google Cloud：GitHub 不存放任何金鑰。
    # 還沒設定（repo 沒有 GCP_WIF_PROVIDER 變數）時自動略過。
    needs: [test, kb-pipeline, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: asia-east1
      SERVICE: course-qa-rag
      IMAGE: asia-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/course-qa-rag:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 建置並上傳映像檔
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: 部署（沿用原本的金鑰、每日上限等設定）
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet
      - name: 部署後檢查
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl -sf "$URL/health"
          curl -sf "$URL/" | grep -q '課程問答'
          echo "### 🚀 已部署：$URL" >> "$GITHUB_STEP_SUMMARY"
