# Service（總機）：固定的入口，自動把請求分配給準備好的那幾份
# NodePort 讓本機測試可以連進叢集（kind 設定把節點的 30080 對應到本機 8080）；
# 正式環境通常改用 ClusterIP 搭配 Ingress 或雲端負載平衡器
apiVersion: v1
kind: Service
metadata:
  name: course-qa-rag
spec:
  type: NodePort
  selector:
    app: course-qa-rag
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
